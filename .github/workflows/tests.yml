name: tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[plot,test]"
      - run: python -m pytest
      - run: cancer-sipf --config configs/quickstart.json
      - run: cancer-fdm-comparison --config configs/fdm_comparison_quick.json
